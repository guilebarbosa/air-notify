    <!-- viewport-fit=cover: the map runs under the iPhone's Dynamic Island / notch; the panel,
         footer and map buttons keep clear of it with env(safe-area-inset-*). -->

         the status bar too. Its clock and battery are then white; a shade at the top of the page
         keeps them readable. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
