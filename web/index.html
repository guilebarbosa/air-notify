<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: in landscape the page uses the whole width, around the iPhone's notch;
         the header, footer, panel and map buttons keep clear of it with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>airNotify</title>
    <!-- Cream icons for the dev server, red for the built app (the Pi), by Vite's build mode.
         The PNG is for browsers without SVG favicons (iPhone Safari); the others take the SVG. -->
    <link rel="icon" type="image/png" sizes="180x180" href="/icons/apple-touch-icon-%MODE%.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-%MODE%.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-%MODE%.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
