# Copy to ~/.config/air-notify/config.toml and edit. That file is personal data
# (home/school coordinates): air-notify keeps it at mode 0600.
# Restart the daemon after changes: deploy/launchagent.sh restart (macOS)
# or deploy/pi-service.sh restart (Linux).

# Minimum 15. Faster polling has gotten Apple accounts banned.
poll_interval_minutes = 15

# Ignore reports fuzzier than this (metres).
max_accuracy_m = 100

# Hysteresis: "arrived" fires within radius_m, "left" only beyond radius_m + exit_buffer_m.
# Reports in between keep the previous state, so GPS jitter at the edge can't cause spam.
exit_buffer_m = 50

# ntfy_server = "https://ntfy.sh"   # or your self-hosted server (https only)

# Location history (optional): every report is appended to history.jsonl in the data
# directory (plain text, mode 0600) and kept this many days. 0 = off, nothing is stored.
history_days = 0

# Alert text, e.g. in your language. {zone} and {time} are filled in.
# A zone can override arrive/leave with its own text; see the School zone below.
# [messages]
# arrive = "Arrived at {zone}"
# leave = "Left {zone}"
# time = "Seen at {time}"

# Map viewer (optional, needs history_days > 0): a web page listing the recorded days,
# each shown on a map. Served by the daemon, or on its own with `air-notify view`.
# host = "0.0.0.0" makes it reachable from other devices on your network, WITHOUT a
# password: anyone on that network can see the history.
# [viewer]
# enabled = true
# host = "127.0.0.1"
# port = 8080

# Right-click a spot in Apple/Google Maps to copy its coordinates.
[[zones]]
name = "Home"
lat = 0.0
lon = 0.0
radius_m = 100

[[zones]]
name = "School"
lat = 0.0
lon = 0.0
radius_m = 150
# Optional, for this zone only (e.g. "Chegou na escola" / "Saiu da escola"):
# arrive = "Arrived at school"
# leave = "Left school"
